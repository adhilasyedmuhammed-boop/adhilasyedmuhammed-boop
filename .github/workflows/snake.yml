name: generate-snake

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch: # allows manual run from Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate snake svgs (golden hour palette)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F59E0B&color_dots=#FDE68A,#FBBF24,#F59E0B,#D97706,#B45309
            dist/snake-light.svg?palette=github-light&color_snake=#B45309&color_dots=#FDE68A,#FBBF24,#F59E0B,#D97706,#B45309

      - name: push snake svgs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
