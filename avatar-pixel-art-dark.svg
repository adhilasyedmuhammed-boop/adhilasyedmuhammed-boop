<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" fill="#0A101F"/>
  
  <!-- Enhanced pixel art avatar with better visibility -->
  <g transform="translate(50, 50)">
    <!-- Head - larger and more defined -->
    <circle cx="50" cy="50" r="45" fill="#1E293B"/>
    
    <!-- Hair - more prominent -->
    <rect x="25" y="15" width="50" height="12" fill="#1E3A8A"/>
    <rect x="20" y="20" width="60" height="8" fill="#1E3A8A"/>
    
    <!-- Face features - larger and more visible -->
    <circle cx="35" cy="45" r="5" fill="#22D3EE"/>
    <circle cx="65" cy="45" r="5" fill="#22D3EE"/>
    
    <!-- Glasses - thicker and more visible -->
    <rect x="28" y="40" width="18" height="10" fill="none" stroke="#22D3EE" stroke-width="3" rx="5"/>
    <rect x="54" y="40" width="18" height="10" fill="none" stroke="#22D3EE" stroke-width="3" rx="5"/>
    <line x1="43" y1="45" x2="57" y2="45" stroke="#22D3EE" stroke-width="3"/>
    
    <!-- Mouth - more defined -->
    <path d="M 38 58 Q 50 63 62 58" fill="none" stroke="#94A3B8" stroke-width="3"/>
    
    <!-- Pixel art grid pattern for authentic look -->
    <g opacity="0.6">
      <!-- Head grid -->
      <rect x="30" y="30" width="8" height="8" fill="#22D3EE"/>
      <rect x="62" y="30" width="8" height="8" fill="#22D3EE"/>
      <rect x="30" y="60" width="8" height="8" fill="#A78BFA"/>
      <rect x="62" y="60" width="8" height="8" fill="#10B981"/>
      
      <!-- Hair grid -->
      <rect x="25" y="20" width="8" height="8" fill="#1E3A8A"/>
      <rect x="67" y="20" width="8" height="8" fill="#1E3A8A"/>
      
      <!-- Background pixels -->
      <rect x="15" y="15" width="6" height="6" fill="#22D3EE"/>
      <rect x="79" y="25" width="6" height="6" fill="#A78BFA"/>
      <rect x="25" y="75" width="6" height="6" fill="#10B981"/>
      <rect x="69" y="65" width="6" height="6" fill="#22D3EE"/>
    </g>
  </g>
  
  <!-- Enhanced grain/particle background -->
  <g opacity="0.25">
    <rect x="25" y="25" width="4" height="4" fill="#22D3EE"/>
    <rect x="171" y="35" width="4" height="4" fill="#A78BFA"/>
    <rect x="35" y="171" width="4" height="4" fill="#10B981"/>
    <rect x="161" y="161" width="4" height="4" fill="#22D3EE"/>
    <rect x="45" y="45" width="4" height="4" fill="#A78BFA"/>
    <rect x="155" y="55" width="4" height="4" fill="#10B981"/>
    <rect x="55" y="155" width="4" height="4" fill="#22D3EE"/>
    <rect x="145" y="145" width="4" height="4" fill="#A78BFA"/>
    <rect x="65" y="65" width="4" height="4" fill="#10B981"/>
    <circle cx="130" cy="80" r="1" fill="#22D3EE"/>
    <circle cx="80" cy="130" r="1" fill="#A78BFA"/>
    <circle cx="120" cy="120" r="1" fill="#10B981"/>
    <circle cx="90" cy="90" r="1" fill="#22D3EE"/>
    <circle cx="110" cy="100" r="1" fill="#A78BFA"/>
    <circle cx="100" cy="110" r="1" fill="#10B981"/>
    <circle cx="20" cy="100" r="1" fill="#22D3EE"/>
    <circle cx="180" cy="90" r="1" fill="#A78BFA"/>
    <circle cx="10" cy="180" r="1" fill="#10B981"/>
    <circle cx="190" cy="170" r="1" fill="#22D3EE"/>
  </g>
</svg>